
- name: "mini-redis"
  github:
    repo: "mini-redis"
  url: "https://kpraveenkumar19.github.io/mini-redis/"
  source_url: "https://github.com/kpraveenkumar19/mini-redis"
  description:
    - Built in-memory <a href="https://redis.io/" target="_blank" rel="noopener noreferrer">Redis</a>-style server and CLI client in Go which supports redis core commands.
